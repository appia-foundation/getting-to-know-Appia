site_name: Appia Foundation — Operations
site_description: Member onboarding and operations site for the Appia Foundation
site_url: https://onboarding.appiafoundation.org/
docs_dir: docs
repo_url: https://github.com/appia-foundation/getting-to-know-appia
repo_name: appia-foundation/getting-to-know-appia
edit_uri: edit/main/docs/

nav:
  - Introduction: index.md
  - Governance: governance.md
  - Member Onboarding: member-onboarding.md
  - Getting to Know Appia: getting-to-know-appia.md
  - Collaborating with GitHub: collaborating-with-github.md
  - Frequently Asked Questions: faq.md
  - Collaboration Framework: collaboration-framework.md

theme:
  name: material
  features:
    - navigation.tracking
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  logo: assets/appia-mark.png
  favicon: assets/favicon.png
  palette:
    scheme: appia

markdown_extensions:
  - toc:
      toc_depth: 2
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - css/appia.css

extra_javascript:
  - javascripts/homepage-link.js

extra:
  generator: false
  copyright: Copyright &copy; 2026 Appia Foundation
  # Overrides the header logo/title link target (defaults to the site's own homepage).
  homepage: https://appiafoundation.org/
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/appiafoundation
      name: Appia Foundation on X
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/appia-foundation/
      name: Appia Foundation on LinkedIn

plugins:
  - search
